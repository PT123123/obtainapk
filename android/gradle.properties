org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# ---- Build performance ----
# Enable the Gradle build cache so previously-built tasks are reused across builds.
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true

# Enable parallel execution for modules (this project has `:app` + Flutter plugin loader).
org.gradle.parallel=true

# Keep the Gradle daemon alive between builds so startup is fast.
org.gradle.daemon=true

# NOTE: org.gradle.configuration-cache=true is intentionally OFF because Flutter's
# MinSdkCheck task (and other plugin tasks) are not serializable for Gradle's
# configuration cache — it causes "cannot serialize object of type JavaCompile" errors.
# See: https://docs.gradle.org/current/userguide/configuration_cache_requirements.html

# Also cache AGP/Kotlin compilation explicitly.
android.gradle.caching=true
kotlin.incremental=true
kotlin.caching.enabled=true
